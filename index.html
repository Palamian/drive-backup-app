<h1>Personal Drive Backup</h1>
<p>This is a private, single-user OAuth client. It is used only by the owner's own copy of
<a href="https://rclone.org/">rclone</a>, running on the owner's own computer, to back up the owner's files
to the owner's own Google Drive.</p>
<p>It is not a public service and is not offered to anyone else.</p>
<p><a href="privacy.html">Privacy policy</a></p>
